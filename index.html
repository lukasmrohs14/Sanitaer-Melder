<body class="bg-gray-100 font-sans text-gray-800 flex items-center justify-center min-h-screen p-4 antialiased">

    <script>
        const SUPABASE_URL = 'https://khptivsvjngoicpknecj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtocHRpdnN2am5nb2ljcGtuZWNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUyMDQsImV4cCI6MjA5MDUyMTIwNH0.dAQK6usd7M-xY0rBwVHVT4ApDgQ93eOD6sa_0rQ53ZE';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Feste Kategorien
        const KATEGORIEN = ['Seife', 'Klopapier', 'Handtücher', 'Defekt'];
        const WC_TYPEN = ['Damen', 'Herren'];

        // Standorte: deaktivierte bleiben drin, werden aber nicht angenommen (aktiv: false)
        const STANDORTE = {
            "HVS": { aktiv: true,  etagen: { "EG": ["Toilette Dispo"], "1. OG": ["Toilette Kantine", "Toilette Vertrieb"] } },
            "LZW": { aktiv: false, etagen: { "EG": ["WC Allgemein"], "1. OG": ["WC Allgemein"], "2. OG": ["WC Allgemein"] } },
            "LZS": { aktiv: false, etagen: { "EG": ["WC Allgemein"], "1. OG": ["WC Allgemein"], "2. OG": ["WC Allgemein"] } },
            "LZO": { aktiv: false, etagen: { "EG": ["WC Allgemein"], "1. OG": ["WC Allgemein"], "2. OG": ["WC Allgemein"] } }
        };

        // Ort-ID für den QR-Code, z. B. "hvs-eg-toilette-dispo-herren"
        function slug(text) {
            return text.toLowerCase()
                .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        function findeOrt(id) {
            for (const [standort, cfg] of Object.entries(STANDORTE)) {
                if (!cfg.aktiv) continue;
                for (const [etage, bereiche] of Object.entries(cfg.etagen)) {
                    for (const bereich of bereiche) {
                        for (const wc of WC_TYPEN) {
                            if (slug(`${standort} ${etage} ${bereich} ${wc}`) === id) return { standort, etage, bereich, wc };
                        }

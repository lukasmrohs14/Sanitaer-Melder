<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service-Ruf - Voigt Logistik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .text-firma-green { color: #006959; }
        .bg-firma-green { background-color: #006959; }
        .bg-firma-yellow { background-color: #F4B827; }
        .border-firma-green { border-color: #006959; }
        * { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .disabled-btn { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #006959; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex items-center justify-center min-h-screen p-4 antialiased">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-white/20 relative min-h-[650px] flex flex-col">

        <!-- Header: Ort kommt fest aus dem QR-Code, kein "Ändern" mehr -->
        <div class="bg-white p-6 text-center relative border-b border-gray-100 shrink-0">
            <div class="absolute top-0 left-0 w-full h-2 bg-firma-yellow"></div>
            <img src="VL_Logo_2022_08176_Voigt_Logistik_CMYK_2022-07-15_AS.png" alt="Logo" class="mx-auto mb-3 h-12 w-auto object-contain">
            <div class="flex flex-col justify-center items-center gap-1">
                <h1 id="current-location-label" class="text-firma-green font-black uppercase tracking-widest text-[11px]">Ort wird geladen...</h1>
                <p id="current-area-label" class="text-gray-400 font-bold text-[9px] uppercase"></p>
            </div>
        </div>

        <!-- Main UI: Tipp auf eine Kategorie sendet sofort -->
        <div id="main-ui" class="hidden p-5 space-y-4 flex-grow flex flex-col overflow-y-auto">
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Antippen zum Melden</p>
            <div class="grid grid-cols-1 gap-3">
                <button id="btn-Seife" onclick="senden('Seife')" class="flex items-center p-5 bg-gray-50 rounded-2xl border-2 border-transparent active:border-firma-green active:bg-white active:scale-[0.97] transition-all">
                    <span class="text-3xl mr-4">🧼</span>
                    <div class="text-left">
                        <span class="block font-black uppercase text-firma-green text-base leading-tight">Seife leer</span>
                        <span class="status-text text-[9px] font-bold text-gray-300 uppercase">Verfügbar</span>
                    </div>
                </button>
                <button id="btn-Klopapier" onclick="senden('Klopapier')" class="flex items-center p-5 bg-gray-50 rounded-2xl border-2 border-transparent active:border-firma-green active:bg-white active:scale-[0.97] transition-all">
                    <span class="text-3xl mr-4">🧻</span>
                    <div class="text-left">
                        <span class="block font-black uppercase text-firma-green text-base leading-tight">Klopapier leer</span>
                        <span class="status-text text-[9px] font-bold text-gray-300 uppercase">Verfügbar</span>
                    </div>
                </button>
                <button id="btn-Handtücher" onclick="senden('Handtücher')" class="flex items-center p-5 bg-gray-50 rounded-2xl border-2 border-transparent active:border-firma-green active:bg-white active:scale-[0.97] transition-all">
                    <span class="text-3xl mr-4">🖐️</span>
                    <div class="text-left">
                        <span class="block font-black uppercase text-firma-green text-base leading-tight">Handtücher leer</span>
                        <span class="status-text text-[9px] font-bold text-gray-300 uppercase">Verfügbar</span>
                    </div>
                </button>
                <button id="btn-Defekt" onclick="senden('Defekt')" class="flex items-center p-5 bg-gray-50 rounded-2xl border-2 border-transparent active:border-firma-green active:bg-white active:scale-[0.97] transition-all">
                    <span class="text-3xl mr-4">🔧</span>
                    <div class="text-left">
                        <span class="block font-black uppercase text-firma-green text-base leading-tight">Defekt melden</span>
                        <span class="status-text text-[9px] font-bold text-gray-300 uppercase">Verfügbar</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- Fehler: QR-Code ohne gültigen Ort -->
        <div id="error-ui" class="hidden p-10 text-center fade-in space-y-4 flex-grow flex flex-col justify-center">
            <div class="mx-auto flex items-center justify-center w-16 h-16 bg-red-100 rounded-full mb-4 text-red-600 text-3xl">!</div>
            <h2 class="font-black text-xl text-firma-green uppercase">Ort unbekannt</h2>
            <p class="text-gray-600 font-bold text-sm">Bitte scannen Sie den QR-Code im Sanitärbereich erneut.</p>
        </div>

        <!-- Success UI (unverändert) -->
        <div id="success-ui" class="hidden p-10 text-center fade-in space-y-4 flex-grow flex flex-col justify-center">
            <div id="status-icon" class="mx-auto flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-4 text-green-600 text-3xl">✓</div>
            <div id="uploading-ui" class="hidden flex flex-col items-center gap-3">
                <div class="loader"></div>
                <p class="text-firma-green font-bold text-sm uppercase">Wird verarbeitet...</p>
            </div>
            <div id="done-ui">
                <h2 class="font-black text-xl text-firma-green uppercase mb-2">Vielen Dank!</h2>
                <p class="text-gray-600 font-bold text-sm">Meldung wurde gesendet für:<br><span id="success-location" class="text-firma-yellow"></span></p>
                <div class="mt-8 px-4"><div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden"><div id="progress-bar" class="h-full bg-firma-yellow w-0 transition-all duration-[3000ms] ease-linear"></div></div></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://khptivsvjngoicpknecj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtocHRpdnN2am5nb2ljcGtuZWNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUyMDQsImV4cCI6MjA5MDUyMTIwNH0.dAQK6usd7M-xY0rBwVHVT4ApDgQ93eOD6sa_0rQ53ZE';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Feste Kategorien
        const KATEGORIEN = ['Seife', 'Klopapier', 'Handtücher', 'Defekt'];
        const WC_TYPEN = ['Damen', 'Herren'];

        // Standorte: deaktivierte bleiben drin, werden aber nicht angenommen (aktiv: false)
        const STANDORTE = {
            "HVS": { aktiv: true,  etagen: { "EG": ["Toilette Dispo"], "1. OG": ["Toilette Kantine", "Toilette Vertrieb"] } },
            "LZW": { aktiv: false, etagen: { "EG": ["WC Allgemein"], "1. OG": ["WC Allgemein"], "2. OG": ["WC Allgemein"] } },
            "LZS": { aktiv: false, etagen: { "EG": ["WC Allgemein"], "1. OG": ["WC Allgemein"], "2. OG": ["WC Allgemein"] } },
            "LZO": { aktiv: false, etagen: { "EG": ["WC Allgemein"], "1. OG": ["WC Allgemein"], "2. OG": ["WC Allgemein"] } }
        };

        // Ort-ID für den QR-Code, z. B. "hvs-eg-toilette-dispo-herren"
        function slug(text) {
            return text.toLowerCase()
                .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        function findeOrt(id) {
            for (const [standort, cfg] of Object.entries(STANDORTE)) {
                if (!cfg.aktiv) continue;
                for (const [etage, bereiche] of Object.entries(cfg.etagen)) {
                    for (const bereich of bereiche) {
                        for (const wc of WC_TYPEN) {
                            if (slug(`${standort} ${etage} ${bereich} ${wc}`) === id) return { standort, etage, bereich, wc };
                        }
                    }
                }
            }
            return null;
        }

        const ort = findeOrt(new URLSearchParams(window.location.search).get('ort') || '');
        let sendetGerade = false;

        // Gleiches Format wie bisher in der Spalte "etage", damit Admin und Auswertung weiter passen
        function etageText() { return `${ort.etage} | ${ort.bereich} | ${ort.wc}`; }

        function init() {
            if (!ort) {
                document.getElementById('current-location-label').innerText = 'Kein gültiger Ort';
                document.getElementById('error-ui').classList.remove('hidden');
                return;
            }
            document.getElementById('current-location-label').innerText = `${ort.standort} | ${ort.etage}`;
            document.getElementById('current-area-label').innerText = `${ort.bereich} (${ort.wc})`;
            document.getElementById('main-ui').classList.remove('hidden');
            checkStatus();
        }

        async function checkStatus() {
            KATEGORIEN.forEach(t => {
                const btn = document.getElementById('btn-' + t);
                btn.classList.remove('disabled-btn');
                btn.querySelector('.status-text').innerText = "Verfügbar";
            });
            const { data, error } = await _supabase.from('meldungen')
                .select('typ')
                .eq('standort', ort.standort)
                .eq('etage', etageText())
                .eq('status', 'offen');
            if (error || !data) return;
            data.forEach(m => markiereGemeldet(m.typ));
        }

        function markiereGemeldet(typ) {
            const btn = document.getElementById('btn-' + typ);
            if (btn) { btn.classList.add('disabled-btn'); btn.querySelector('.status-text').innerText = "Bereits gemeldet"; }
        }

        async function senden(typ) {
            if (!ort || sendetGerade || !KATEGORIEN.includes(typ)) return;
            if (document.getElementById('btn-' + typ).classList.contains('disabled-btn')) return;
            sendetGerade = true;

            document.getElementById('main-ui').classList.add('hidden');
            document.getElementById('success-ui').classList.remove('hidden');
            document.getElementById('status-icon').classList.add('hidden');
            document.getElementById('done-ui').classList.add('hidden');
            document.getElementById('uploading-ui').classList.remove('hidden');

            const { error } = await _supabase.from('meldungen').insert([{
                typ, standort: ort.standort, etage: etageText(), status: 'offen'
            }]);

            // 23505 = jemand hat dieselbe Kategorie gerade schon gemeldet (eindeutiger Index) -> gilt als erledigt
            if (error && error.code !== '23505') {
                alert("Die Meldung konnte nicht gesendet werden. Bitte erneut versuchen.");
                document.getElementById('success-ui').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                sendetGerade = false;
                return;
            }

            markiereGemeldet(typ);
            document.getElementById('uploading-ui').classList.add('hidden');
            document.getElementById('status-icon').classList.remove('hidden');
            document.getElementById('done-ui').classList.remove('hidden');
            document.getElementById('success-location').innerText = `${ort.standort}, ${etageText()}`;

            setTimeout(() => { document.getElementById('progress-bar').style.width = '100%'; }, 50);
            setTimeout(() => {
                document.getElementById('main-ui').classList.remove('hidden');
                document.getElementById('success-ui').classList.add('hidden');
                document.getElementById('progress-bar').style.width = '0%';
                sendetGerade = false;
                checkStatus();
            }, 3000);
        }

        // Status aktualisieren, wenn die Seite wieder in den Vordergrund kommt
        document.addEventListener('visibilitychange', () => { if (!document.hidden && ort && !sendetGerade) checkStatus(); });

        init();
    </script>
</body>
</html>
